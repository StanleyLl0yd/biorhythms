name: Prepare 1.4.3 release metadata

on:
  push:
    branches:
      - release/1.4.3
    paths:
      - .github/workflows/release-prep-1.4.3.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: release/1.4.3

      - name: Update release metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('CHANGELOG.md'): (
                  '## [Unreleased]\n\n',
                  '## [Unreleased]\n\n---\n\n## [1.4.3] - 2026-09-02\n\n',
              ),
              Path('CHANGELOG.ru.md'): (
                  '## [Unreleased]\n\n',
                  '## [Unreleased]\n\n---\n\n## [1.4.3] - 02.09.2026\n\n',
              ),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'marker not found in {path}')
              path.write_text(text.replace(old, new, 1))

          for name in ('README.md', 'README.ru.md'):
              path = Path(name)
              text = path.read_text()
              text = text.replace('1.4.2', '1.4.3')
              path.write_text(text)
          PY

      - name: Remove temporary workflow and commit
        run: |
          set -euo pipefail
          git rm .github/workflows/release-prep-1.4.3.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md CHANGELOG.ru.md README.md README.ru.md
          git commit -m 'Finalize 1.4.3 release notes'
          git push origin HEAD:release/1.4.3