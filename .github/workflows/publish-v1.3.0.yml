name: Publish v1.3.0

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v1.3.0.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: '33065778652'
      SOURCE_COMMIT: 'e9b0e7e8842f97305fe92cd513ef1e00b3412999'
      SIGNED_APK_SHA256: '115f82b01dc5dd5e105edfc98bbadd3eb8df78e9526634c992d3ffb5ea4785e6'
      SIGNER_SHA256: 'f02571c40741e2cb071564f5b63fd3dc38a875d0eda11a8c42269ed635bc2a58'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download validated release artifacts
        run: |
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name biorhythms-signed-release-apk \
            --dir release-apk
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name biorhythms-offline-signing-kit \
            --dir release-tools
          mv release-apk/app-release.apk biorhythms-v1.3.0.apk
          echo "$SIGNED_APK_SHA256  biorhythms-v1.3.0.apk" | sha256sum -c -

      - name: Verify APK signature
        run: |
          java -jar release-tools/apksigner.jar verify --verbose --print-certs biorhythms-v1.3.0.apk | tee signature.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' signature.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' signature.txt
          grep -q "certificate SHA-256 digest: $SIGNER_SHA256" signature.txt

      - name: Publish GitHub Release
        run: |
          cat > release-notes.md <<'EOF'
          Biorhythms 1.3.0 focuses on a clearer, more polished interface while keeping the app simple and lightweight.

          ### 📊 Main screen and chart
          - Added first-run birth-date onboarding directly on the main screen.
          - Added selected-day summary cards for physical, emotional and intellectual values.
          - Added interactive chart inspection by tap or drag.
          - Simplified the chart grid to five-day intervals and highlighted the selected day.

          ### 🎨 Settings and widget
          - Redesigned Settings with larger Material rows and clearer visual hierarchy.
          - Added a live widget preview.
          - Added a checkerboard transparency backdrop so widget background opacity is easy to judge before saving.
          - Improved opacity controls on narrow screens.

          ### ℹ️ About and licensing
          - Added an in-app About screen with a short description, version, author Stanley Lloyd, license and GitHub source link.
          - The project is licensed under PolyForm Noncommercial License 1.0.0.

          ### 🛠 Quality
          - Added chart interaction unit tests.
          - Cleaned redundant and non-English project comments.
          - Standardized Android release signing with repository secrets.
          - The release APK is signed with the same production certificate as v1.2.0 and supports APK Signature Scheme v2 and v3.

          Android 8.0 (API 26) or newer is required.

          APK SHA-256: `115f82b01dc5dd5e105edfc98bbadd3eb8df78e9526634c992d3ffb5ea4785e6`
          EOF

          if gh release view v1.3.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.3.0 "biorhythms-v1.3.0.apk#Android APK" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit v1.3.0 \
              --repo "$GITHUB_REPOSITORY" \
              --title 'Biorhythms v1.3.0 – UI/UX & Interactive Chart' \
              --notes-file release-notes.md \
              --latest
          else
            gh release create v1.3.0 \
              "biorhythms-v1.3.0.apk#Android APK" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_COMMIT" \
              --title 'Biorhythms v1.3.0 – UI/UX & Interactive Chart' \
              --notes-file release-notes.md \
              --latest
          fi
