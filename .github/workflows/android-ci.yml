name: Android CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.13

      - name: Commit standard Gradle wrapper if missing
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if git ls-files --error-unmatch gradle/wrapper/gradle-wrapper.jar >/dev/null 2>&1; then
            echo "Gradle wrapper JAR is already tracked."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties gradlew gradlew.bat
          git commit -m "Restore standard Gradle wrapper"
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build release and compile Android tests
        run: ./gradlew assembleRelease compileDebugAndroidTestKotlin --stacktrace

      - name: Run Android lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: ignore
