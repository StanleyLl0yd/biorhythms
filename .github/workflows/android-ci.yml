name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions: {}

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify CI supply-chain policy
        run: python3 .github/scripts/verify-ci-supply-chain.py

      - name: Set up Android build environment
        uses: ./.github/actions/android-gradle-setup
        with:
          gradle-cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Install Android 37 platform
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK and compile Android tests
        run: ./gradlew assembleDebug compileDebugAndroidTestKotlin --stacktrace

      - name: Run Android lint
        run: ./gradlew lintDebug --stacktrace

      - name: Verify release build without signing
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Verify Google Play release compatibility
        run: |
          set -euo pipefail
          release_apk=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$release_apk"
          python3 .github/scripts/verify-play-compatibility.py \
            --gradle-file app/build.gradle.kts \
            --apk "$release_apk" \
            --aab app/build/outputs/bundle/release/app-release.aab

      - name: Verify launcher icon artwork
        run: |
          set -euo pipefail
          release_apk=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$release_apk"
          python3 .github/scripts/verify-launcher-icon.py --apk "$release_apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: biorhythms-debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: biorhythms-lint-reports-${{ github.sha }}
          path: |
            app/build/reports/lint-results-debug.html
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: ignore
          retention-days: 14

  android-tests:
    name: Android runtime tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'schedule' && '[{"api-level":"26","system-image":"system-images;android-26;google_apis;x86_64"},{"api-level":"37","system-image":"system-images;android-37.0;google_apis_ps16k;x86_64"}]' || '[{"api-level":"37","system-image":"system-images;android-37.0;google_apis_ps16k;x86_64"}]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Android test environment
        uses: ./.github/actions/android-gradle-setup
        with:
          android-packages: platform-tools emulator
          gradle-cache-read-only: true

      - name: Install Android SDK and system image
        run: |
          sdkmanager \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "${{ matrix.system-image }}"

      - name: Configure AVD home
        run: |
          mkdir -p "$RUNNER_TEMP/avd"
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/avd" >> "$GITHUB_ENV"

      - name: Create emulator
        run: |
          echo "no" | avdmanager create avd \
            --force \
            --name biorhythms-ci \
            --package "${{ matrix.system-image }}" \
            --device pixel

      - name: Start emulator
        run: |
          sudo chmod 666 /dev/kvm || true
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd biorhythms-ci \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -gpu software \
            > "$RUNNER_TEMP/emulator.log" 2>&1 &
          timeout 120 adb wait-for-device
          timeout 240 bash -c 'until [[ "$(adb shell getprop sys.boot_completed | tr -d "\r")" == "1" ]]; do sleep 2; done'
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

      - name: Verify 16 KB emulator page size
        if: matrix.api-level == '37'
        run: test "$(adb shell getconf PAGESIZE | tr -d '\r')" = "16384"

      - name: Run Android tests
        run: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Collect store screenshots
        if: always()
        run: |
          set -euo pipefail
          source_dir="/sdcard/Download/biorhythms-store-screenshots"
          target_dir="app/build/reports/androidTests/connected/store-screenshots"
          mkdir -p "$target_dir"
          adb shell test -d "$source_dir"
          adb pull "$source_dir/." "$target_dir/"
          test -s "$target_dir/01_today.png"
          test -s "$target_dir/02_7_days.png"
          test -s "$target_dir/03_notifications.png"
          test -s "$target_dir/04_about.png"
          test -s "$target_dir/05_widget.png"

      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-test-reports-api-${{ matrix.api-level }}-${{ github.sha }}
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
          retention-days: 14

      - name: Show emulator log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/emulator.log" || true

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          vulnerability-check: true
          license-check: true
          comment-summary-in-pr: never
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 120
          show-patched-versions: true

  semgrep:
    name: Semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    container:
      image: semgrep/semgrep:1.172.0@sha256:65dcd4408adda7c183a6b4550cb1e9b19f7f627a6fbb7e0559bd466bedc44d7b

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Semgrep CE
        run: semgrep scan --config p/security-audit --config p/secrets --error --metrics=off .

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

  verify:
    name: Verify
    if: always()
    needs:
      - build
      - android-tests
      - dependency-review
      - semgrep
      - gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Enforce verification results
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          ANDROID_TEST_RESULT: ${{ needs.android-tests.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          SEMGREP_RESULT: ${{ needs.semgrep.result }}
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$BUILD_RESULT" = "success"
          test "$ANDROID_TEST_RESULT" = "success"
          test "$SEMGREP_RESULT" = "success"
          test "$GITLEAKS_RESULT" = "success"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            test "$DEPENDENCY_REVIEW_RESULT" = "success"
          else
            test "$DEPENDENCY_REVIEW_RESULT" = "skipped"
          fi
