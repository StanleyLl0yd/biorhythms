name: Android CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    env:
      BIORHYTHMS_STORE_PASSWORD: ${{ secrets.BIORHYTHMS_STORE_PASSWORD }}
      BIORHYTHMS_KEY_ALIAS: ${{ secrets.BIORHYTHMS_KEY_ALIAS }}
      BIORHYTHMS_KEY_PASSWORD: ${{ secrets.BIORHYTHMS_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore when configured
        env:
          BIORHYTHMS_KEYSTORE_BASE64: ${{ secrets.BIORHYTHMS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$BIORHYTHMS_KEYSTORE_BASE64" ]; then
            echo "$BIORHYTHMS_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/biorhythms-release.jks"
            echo "BIORHYTHMS_KEYSTORE_PATH=$RUNNER_TEMP/biorhythms-release.jks" >> "$GITHUB_ENV"
            echo "BIORHYTHMS_HAS_RELEASE_SIGNING=true" >> "$GITHUB_ENV"
          else
            echo "BIORHYTHMS_HAS_RELEASE_SIGNING=false" >> "$GITHUB_ENV"
          fi

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build release artifacts and compile Android tests
        run: ./gradlew assembleDebug assembleRelease bundleRelease compileDebugAndroidTestKotlin --stacktrace

      - name: Run Android lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: biorhythms-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload signed release APK when signing is configured
        if: ${{ env.BIORHYTHMS_HAS_RELEASE_SIGNING == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: biorhythms-signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Prepare offline signing kit
        run: |
          mkdir -p "$RUNNER_TEMP/offline-signing"
          cp app/build/outputs/apk/release/*.apk "$RUNNER_TEMP/offline-signing/"
          APKSIGNER_JAR="$(find "$ANDROID_HOME/build-tools" -type f -path '*/lib/apksigner.jar' | sort -V | tail -n 1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          LIBCXX="$(find "$ANDROID_HOME/build-tools" -type f -name 'libc++.so' | sort -V | tail -n 1)"
          test -n "$APKSIGNER_JAR"
          test -n "$ZIPALIGN"
          test -n "$LIBCXX"
          cp "$APKSIGNER_JAR" "$RUNNER_TEMP/offline-signing/apksigner.jar"
          cp "$ZIPALIGN" "$RUNNER_TEMP/offline-signing/zipalign"
          cp "$LIBCXX" "$RUNNER_TEMP/offline-signing/libc++.so"
          chmod +x "$RUNNER_TEMP/offline-signing/zipalign"

      - name: Upload offline signing kit
        uses: actions/upload-artifact@v4
        with:
          name: biorhythms-offline-signing-kit
          path: ${{ runner.temp }}/offline-signing
          if-no-files-found: error

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: biorhythms-release-bundle
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: ignore
