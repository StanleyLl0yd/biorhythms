name: Android CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build RC artifacts and compile Android tests
        run: ./gradlew assembleDebug assembleRelease bundleRelease compileDebugAndroidTestKotlin --stacktrace

      - name: Run Android lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload smoke-test APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: biorhythms-1.2.0-rc1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: biorhythms-1.2.0-rc1-release-bundle
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: ignore
