name: Generate Gradle verification metadata

on:
  push:
    branches:
      - hardening/full-audit-fixes

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools

      - name: Install Android 37 platform
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: true
          validate-wrappers: true

      - name: Generate verification metadata
        run: |
          ./gradlew \
            --write-verification-metadata sha256 \
            testDebugUnitTest \
            assembleDebug \
            compileDebugAndroidTestKotlin \
            lintDebug \
            assembleRelease \
            bundleRelease \
            --stacktrace

      - name: Upload verification metadata
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gradle-verification-metadata
          path: gradle/verification-metadata.xml
          if-no-files-found: error
          retention-days: 1
