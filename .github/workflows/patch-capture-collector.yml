name: Patch capture collector

on:
  push:
    branches:
      - tooling/capture-rustore-1.7.0

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: tooling/capture-rustore-1.7.0

      - name: Patch collector and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/android-ci.yml')
          text = path.read_text()
          old = '''          package_name="com.sl.biorhythms"
          target_dir="app/build/reports/androidTests/connected/store-screenshots"
          mkdir -p "$target_dir"
          files=(
            01_today.png
            02_7_days.png
            03_notifications.png
            04_about.png
            05_widget.png
          )
          for file in "${files[@]}"; do
            adb exec-out run-as "$package_name" cat "files/store-screenshots/$file" > "$target_dir/$file"
            test -s "$target_dir/$file"
          done
'''
          new = '''          package_name="com.sl.biorhythms"
          app_apk=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)
          test_apk=$(find app/build/outputs/apk/androidTest -type f -name '*.apk' -print -quit)
          test -n "$app_apk"
          test -n "$test_apk"
          adb install -r "$app_apk" >/dev/null
          adb install -r "$test_apk" >/dev/null
          adb shell am instrument -w -r \\
            -e class 'com.sl.biorhythms.StoreScreenshotInstrumentedTest,com.sl.biorhythms.SettingsStoreScreenshotInstrumentedTest,com.sl.biorhythms.AboutStoreScreenshotInstrumentedTest,com.sl.biorhythms.WidgetStoreScreenshotInstrumentedTest' \\
            "$package_name.test/androidx.test.runner.AndroidJUnitRunner"

          target_dir="app/build/reports/androidTests/connected/store-screenshots"
          rm -rf "$target_dir"
          mkdir -p "$target_dir"
          files=(
            01_today.png
            02_7_days.png
            03_notifications.png
            04_about.png
            05_widget.png
          )
          for file in "${files[@]}"; do
            adb exec-out run-as "$package_name" cat "files/store-screenshots/$file" > "$target_dir/$file"
            test -s "$target_dir/$file"
          done
'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one collector block, found {count}')
          path.write_text(text.replace(old, new))
          PY
          rm .github/workflows/patch-capture-collector.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/android-ci.yml .github/workflows/patch-capture-collector.yml
          git commit -m "Rerun screenshot tests before private export"
          git push origin HEAD:tooling/capture-rustore-1.7.0
