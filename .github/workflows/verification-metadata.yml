name: Generate Dependency Verification Metadata

on:
  push:
    branches:
      - release/v1.4.0
    paths:
      - '.github/workflows/verification-metadata.yml'

permissions:
  contents: read

jobs:
  generate:
    name: Generate verification metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Android build environment
        uses: ./.github/actions/android-gradle-setup
        with:
          gradle-cache-read-only: true

      - name: Install Android 37 platform
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Generate SHA-256 verification metadata
        run: ./gradlew --write-verification-metadata sha256 testDebugUnitTest assembleDebug compileDebugAndroidTestKotlin lintDebug assembleRelease bundleRelease --stacktrace

      - name: Upload verification metadata
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: verification-metadata
          path: gradle/verification-metadata.xml
          if-no-files-found: error
          retention-days: 1
