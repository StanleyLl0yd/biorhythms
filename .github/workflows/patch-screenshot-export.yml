name: Patch screenshot export collector

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - name: Replace collector and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/android-ci.yml')
          text = path.read_text()
          old = '''          source_dir="/sdcard/Download/biorhythms-store-screenshots"
          target_dir="app/build/reports/androidTests/connected/store-screenshots"
          mkdir -p "$target_dir"
          files=(
            01_today.png
            02_7_days.png
            03_notifications.png
            04_about.png
            05_widget.png
          )
          for file in "${files[@]}"; do
            adb pull "$source_dir/$file" "$target_dir/$file" >/dev/null
            test -s "$target_dir/$file"
          done
'''
          new = '''          package_name="com.sl.biorhythms"
          target_dir="app/build/reports/androidTests/connected/store-screenshots"
          mkdir -p "$target_dir"
          files=(
            01_today.png
            02_7_days.png
            03_notifications.png
            04_about.png
            05_widget.png
          )
          for file in "${files[@]}"; do
            adb exec-out run-as "$package_name" cat "files/store-screenshots/$file" > "$target_dir/$file"
            test -s "$target_dir/$file"
          done
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one collector block, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          rm .github/workflows/patch-screenshot-export.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/android-ci.yml .github/workflows/patch-screenshot-export.yml
          git commit -m "Fix store screenshot export from app storage"
          git push origin HEAD:${{ github.head_ref }}
