name: Android Release

on:
  push:
    branches:
      - 'release/v*'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build, for example v1.4.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  verify-release:
    name: Verify release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      release_tag: ${{ steps.release_meta.outputs.release_tag }}
      release_sha: ${{ steps.release_meta.outputs.release_sha }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.sha }}
          persist-credentials: false

      - id: release_meta
        name: Resolve and validate release
        run: |
          set -euo pipefail
          version_name=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          version_code=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$version_name"
          test -n "$version_code"

          release_tag="v$version_name"
          [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            test "${{ inputs.release_tag }}" = "$release_tag"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            test "${{ github.ref_name }}" = "$release_tag"
          else
            test "${{ github.ref_name }}" = "release/$release_tag"
          fi

          release_sha=$(git rev-parse HEAD)
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "Validated $release_tag with versionCode $version_code at $release_sha"

      - &checkout_ci_helpers
        name: Checkout CI helpers
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci
          persist-credentials: false

      - &setup_release_environment
        name: Set up Android release environment
        uses: ./.ci/.github/actions/android-gradle-setup
        with:
          gradle-cache-read-only: true

      - &install_android_platform
        name: Install Android 37 platform
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Run release verification
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease bundleRelease --stacktrace

      - name: Verify Google Play release compatibility
        run: |
          set -euo pipefail
          release_apk=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$release_apk"
          python3 .ci/.github/scripts/verify-play-compatibility.py \
            --gradle-file app/build.gradle.kts \
            --apk "$release_apk" \
            --aab app/build/outputs/bundle/release/app-release.aab

      - name: Verify launcher icon artwork
        run: |
          set -euo pipefail
          release_apk=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$release_apk"
          python3 .github/scripts/verify-launcher-icon.py --apk "$release_apk"

  signed-release:
    name: Signed release build
    needs: verify-release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ needs.verify-release.outputs.release_tag }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.verify-release.outputs.release_sha }}
          persist-credentials: false

      - *checkout_ci_helpers
      - *setup_release_environment
      - *install_android_platform

      - name: Restore and validate release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-release.jks"
          test -s "$RUNNER_TEMP/android-release.jks"
          keytool -list \
            -keystore "$RUNNER_TEMP/android-release.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Build signed release AAB and APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/android-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease --stacktrace

      - name: Verify signed release outputs
        run: |
          set -euo pipefail
          apksigner_path="$ANDROID_SDK_ROOT/build-tools/37.0.0/apksigner"
          test -x "$apksigner_path"
          "$apksigner_path" verify app/build/outputs/apk/release/app-release.apk
          aab_verification=$(jarsigner -verify app/build/outputs/bundle/release/app-release.aab 2>&1)
          grep -Fq 'jar verified.' <<< "$aab_verification"
          python3 .ci/.github/scripts/verify-play-compatibility.py \
            --gradle-file app/build.gradle.kts \
            --apk app/build/outputs/apk/release/app-release.apk \
            --aab app/build/outputs/bundle/release/app-release.aab
          python3 .github/scripts/verify-launcher-icon.py \
            --apk app/build/outputs/apk/release/app-release.apk

      - name: Upload Google Play bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: biorhythms-${{ env.RELEASE_TAG }}-google-play-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload direct-install APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: biorhythms-${{ env.RELEASE_TAG }}-direct-install-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/android-release.jks"

  publish-release:
    name: Publish GitHub Release
    needs:
      - verify-release
      - signed-release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.verify-release.outputs.release_tag }}
      RELEASE_SHA: ${{ needs.verify-release.outputs.release_sha }}

    steps:
      - name: Download signed release artifacts
        run: |
          set -euo pipefail
          mkdir -p release-assets/bundle release-assets/apk
          gh run download "$GITHUB_RUN_ID" \
            --name "biorhythms-${RELEASE_TAG}-google-play-aab" \
            --dir release-assets/bundle
          gh run download "$GITHUB_RUN_ID" \
            --name "biorhythms-${RELEASE_TAG}-direct-install-apk" \
            --dir release-assets/apk

      - name: Prepare release assets
        run: |
          set -euo pipefail
          test -s release-assets/bundle/app-release.aab
          test -s release-assets/apk/app-release.apk
          mv release-assets/bundle/app-release.aab "release-assets/biorhythms-${RELEASE_TAG}.aab"
          mv release-assets/apk/app-release.apk "release-assets/biorhythms-${RELEASE_TAG}.apk"
          (
            cd release-assets
            sha256sum "biorhythms-${RELEASE_TAG}.aab" "biorhythms-${RELEASE_TAG}.apk" > SHA256SUMS.txt
          )

      - name: Publish GitHub Release
        run: |
          set -euo pipefail
          assets=(
            "release-assets/biorhythms-${RELEASE_TAG}.aab"
            "release-assets/biorhythms-${RELEASE_TAG}.apk"
            "release-assets/SHA256SUMS.txt"
          )

          if tag_sha=$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha' 2>/dev/null); then
            test "$tag_sha" = "$RELEASE_SHA"
          else
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" \
              -f sha="$RELEASE_SHA" >/dev/null
            tag_sha=$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')
            test "$tag_sha" = "$RELEASE_SHA"
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag \
              --title "Biorhythms ${RELEASE_TAG#v}" \
              --generate-notes \
              --latest
          fi
