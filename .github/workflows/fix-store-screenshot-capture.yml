name: Fix store screenshot capture

on:
  push:
    branches:
      - tooling/capture-rustore-1.7.0

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: tooling/capture-rustore-1.7.0

      - name: Patch screenshot transport
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/android-ci.yml')
          text = workflow.read_text()
          old = '''          package="com.sl.biorhythms"
          source_dir="/data/data/$package/files/store-screenshots"
'''
          new = '''          source_dir="/sdcard/Download/biorhythms-store-screenshots"
'''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new)
          old = '''            adb exec-out run-as "$package" cat "$source_dir/$file" > "$target_dir/$file"
            test -s "$target_dir/$file"
'''
          new = '''            adb pull "$source_dir/$file" "$target_dir/$file" >/dev/null
            test -s "$target_dir/$file"
'''
          assert text.count(old) == 1, text.count(old)
          workflow.write_text(text.replace(old, new))

          test_file = Path('app/src/androidTest/java/com/sl/biorhythms/StoreScreenshotInstrumentedTest.kt')
          text = test_file.read_text()
          old = '''private fun saveStoreScreenshot(fileName: String, image: ImageBitmap) {
    val context = InstrumentationRegistry.getInstrumentation().targetContext
    val directory = File(context.filesDir, "store-screenshots").apply {
        mkdirs()
    }
    val file = File(directory, fileName)
    file.outputStream().use { output ->
        check(image.asAndroidBitmap().compress(Bitmap.CompressFormat.PNG, 100, output))
    }
    check(file.isFile && file.length() > 0L)
}
'''
          new = '''private fun saveStoreScreenshot(fileName: String, image: ImageBitmap) {
    val instrumentation = InstrumentationRegistry.getInstrumentation()
    val context = instrumentation.targetContext
    val directory = File(context.filesDir, "store-screenshots").apply {
        mkdirs()
    }
    val file = File(directory, fileName)
    file.outputStream().use { output ->
        check(image.asAndroidBitmap().compress(Bitmap.CompressFormat.PNG, 100, output))
    }
    check(file.isFile && file.length() > 0L)

    val sharedDirectory = "/sdcard/Download/biorhythms-store-screenshots"
    val command =
        "mkdir -p $sharedDirectory && " +
            "run-as ${context.packageName} cat ${file.absolutePath} > $sharedDirectory/$fileName"
    instrumentation.uiAutomation.executeShellCommand(command).use { descriptor ->
        android.os.ParcelFileDescriptor.AutoCloseInputStream(descriptor).use { input ->
            input.readBytes()
        }
    }
}
'''
          assert text.count(old) == 1, text.count(old)
          test_file.write_text(text.replace(old, new))
          PY

          python3 .github/scripts/verify-ci-supply-chain.py
          grep -F 'source_dir="/sdcard/Download/biorhythms-store-screenshots"' .github/workflows/android-ci.yml
          grep -F 'run-as ${context.packageName} cat ${file.absolutePath}' app/src/androidTest/java/com/sl/biorhythms/StoreScreenshotInstrumentedTest.kt

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-store-screenshot-capture.yml
          git add .github/workflows/android-ci.yml app/src/androidTest/java/com/sl/biorhythms/StoreScreenshotInstrumentedTest.kt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Fix screenshot artifact transport'
          git push origin HEAD:tooling/capture-rustore-1.7.0
