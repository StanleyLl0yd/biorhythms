name: Tag release version

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: tag-release-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      checks: read
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      exists: ${{ steps.existing.outputs.exists }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify CI supply-chain policy
        run: python3 .github/scripts/verify-ci-supply-chain.py

      - name: Read release version
        id: version
        run: |
          set -euo pipefail
          version_name="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          version_code="$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -1)"
          namespace="$(sed -n 's/^[[:space:]]*namespace = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          application_id="$(sed -n 's/^[[:space:]]*applicationId = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          tag="v$version_name"

          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$version_code" =~ ^[0-9]+$ ]]
          (( version_code > 0 ))
          test "$namespace" = "com.sl.biorhythms"
          test "$application_id" = "com.sl.biorhythms"
          grep -Fq "## [$version_name] -" CHANGELOG.md
          grep -Fq "## [$version_name] -" CHANGELOG.ru.md

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check existing tag
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh api "/repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for main verification
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          required_workflows=("Android CI" "CodeQL")

          for attempt in $(seq 1 40); do
            runs="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100")"
            checks="$(gh api "/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100")"
            pending=0

            for workflow in "${required_workflows[@]}"; do
              record="$(jq -c --arg name "$workflow" \
                '[.workflow_runs[] | select(.name == $name and .event == "push" and .head_branch == "main")] | sort_by(.created_at) | last // empty' \
                <<< "$runs")"

              if [[ -z "$record" ]]; then
                echo "$workflow: waiting"
                pending=1
                continue
              fi

              status="$(jq -r '.status' <<< "$record")"
              conclusion="$(jq -r '.conclusion // ""' <<< "$record")"
              if [[ "$status" != "completed" ]]; then
                echo "$workflow: $status"
                pending=1
              elif [[ "$conclusion" != "success" ]]; then
                echo "$workflow failed with conclusion '$conclusion'." >&2
                exit 1
              else
                echo "$workflow: success"
              fi
            done

            sonar="$(jq -c \
              '[.check_runs[] | select(.name == "SonarCloud Code Analysis")] | sort_by(.started_at) | last // empty' \
              <<< "$checks")"
            if [[ -z "$sonar" ]]; then
              echo "SonarCloud Code Analysis: waiting"
              pending=1
            else
              sonar_status="$(jq -r '.status' <<< "$sonar")"
              sonar_conclusion="$(jq -r '.conclusion // ""' <<< "$sonar")"
              if [[ "$sonar_status" != "completed" ]]; then
                echo "SonarCloud Code Analysis: $sonar_status"
                pending=1
              elif [[ "$sonar_conclusion" != "success" ]]; then
                echo "SonarCloud Code Analysis failed with conclusion '$sonar_conclusion'." >&2
                exit 1
              else
                echo "SonarCloud Code Analysis: success"
              fi
            fi

            if (( pending == 0 )); then
              exit 0
            fi

            if (( attempt < 40 )); then
              sleep 15
            fi
          done

          echo "Timed out waiting for required main verification." >&2
          exit 1

  tag:
    name: Create verified release tag
    needs: prepare
    if: needs.prepare.outputs.exists == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: write

    steps:
      - name: Create tag and start release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

          gh api --method POST \
            "/repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$RELEASE_TAG" \
            -f sha="$GITHUB_SHA"

          jq -n --arg tag "$RELEASE_TAG" \
            '{ref:"main",inputs:{release_tag:$tag}}' | \
            gh api --method POST \
              "/repos/$GITHUB_REPOSITORY/actions/workflows/android-release.yml/dispatches" \
              --input -
