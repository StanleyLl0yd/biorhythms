name: Widget Preview Validation

on:
  push:
    branches:
      - ci/widget-preview-validation

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Test, build and lint
        run: ./gradlew testDebugUnitTest assembleRelease lintDebug --stacktrace

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: biorhythms-widget-preview-unsigned-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
