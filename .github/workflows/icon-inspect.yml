name: Install Approved Launcher PNG

on:
  push:
    branches:
      - fix/original-png-icon-1.6.2

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify artwork pixels and install PNG
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib

          source = Path('app/src/main/ic_launcher-playstore.png')
          expected_pixel_hash = 'a535b3274097841ce531ceaa5b5833d1818ba7ed69a3769641b9681e18ccdc9a'
          data = source.read_bytes()
          image = Image.open(source).convert('RGBA')
          pixel_hash = hashlib.sha256(image.tobytes()).hexdigest()
          print('Source file SHA-256:', hashlib.sha256(data).hexdigest())
          print('Source RGBA pixel SHA-256:', pixel_hash)
          print('Source size:', image.size)
          if image.size != (512, 512):
              raise SystemExit('Source artwork is not 512x512')
          if pixel_hash != expected_pixel_hash:
              raise SystemExit('Repository artwork pixels differ from approved original PNG')
          PY

          target="app/src/main/res/drawable-nodpi/ic_launcher_artwork.png"
          mkdir -p "$(dirname "$target")"
          cp app/src/main/ic_launcher-playstore.png "$target"

          rm -rf .github/icon-parts
          rm -f .github/workflows/icon-inspect.yml

          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Install approved launcher PNG artwork"
          git push
